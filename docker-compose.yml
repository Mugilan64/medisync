services:
  mysql:
    image: mysql:8.0
    container_name: medisync_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medisync_db}
      MYSQL_USER: ${MYSQL_USER:-medisync_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-MediSync@Pass2024}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - medisync_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: medisync_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - medisync_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medisync_backend
    restart: unless-stopped
    environment:
      MYSQL_USER: ${MYSQL_USER:-medisync_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-MediSync@Pass2024}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medisync_db}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey_change_in_production_2024}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    networks:
      - medisync_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: medisync_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - medisync_network

volumes:
  mysql_data:
  uploads_data:

networks:
  medisync_network:
    driver: bridge